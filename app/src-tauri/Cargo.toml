[package]
name = "astrolabe-desktop"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde_json = { version = "=1.0.154", optional = true }
getrandom = { version = "=0.4.3", optional = true }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5", optional = true }
block2 = { version = "=0.6.2", optional = true }
[target.'cfg(windows)'.dependencies]
webview2-com = { version = "=0.39.1", optional = true }
[features]
test-control = ["tauri/custom-protocol", "dep:serde_json", "dep:getrandom", "dep:objc2", "dep:block2", "dep:webview2-com"]
