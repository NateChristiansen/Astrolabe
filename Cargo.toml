[workspace]
members = ["crates/astrolabe"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.34.0"
installers = ["shell", "powershell"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
install-path = "~/.local/bin"
install-updater = false
checksum = "sha256"
unix-archive = ".tar.gz"
windows-archive = ".zip"
# The build jobs only upload CI artifacts; publish-nightly replaces the nightly prerelease on
# pushes to main, and versioned releases are published by hand (docs/releases.md).
ci = []
hosting = ["github"]

[workspace.metadata.dist.min-glibc-version]
x86_64-unknown-linux-gnu = "2.35"
