name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # Each commit is checked once. A branch push checks it, so the same commit landing on
  # main, or the same branch's pull request, doesn't run the systems again. A commit that
  # reaches main unchecked, such as a merge made on the website, and a fork's pull request
  # still run them.
  gate:
    runs-on: ubuntu-22.04
    permissions:
      checks: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" = "$REPO" ]; then
            echo "The branch push checks this pull request's commit."
            run=false
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && [ "$(scripts/ci-checked)" = true ]; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  mac:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/system.yml
    with:
      os: macos-latest
  windows:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/system.yml
    with:
      os: windows-latest
  linux:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/system.yml
    with:
      os: ubuntu-22.04
