name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mac:
    uses: ./.github/workflows/system.yml
    with:
      os: macos-latest
  windows:
    uses: ./.github/workflows/system.yml
    with:
      os: windows-latest
  linux:
    uses: ./.github/workflows/system.yml
    with:
      os: ubuntu-22.04
