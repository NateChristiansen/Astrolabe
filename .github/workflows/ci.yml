name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.9
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -p protocol --bin export-schemas
      - run: git diff --exit-code -- protocol/schemas
      - run: pnpm --dir adapters install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app generate:protocol
      - run: git diff --exit-code -- app/src/protocol
      - run: pnpm --dir app typecheck
      - run: pnpm --dir app build
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --check
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml --locked
      - run: node --test scripts/seed.test.cjs
      - run: node --test scripts/scrub-codex.test.cjs
  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: '["app"]'
            bundle: app/src-tauri/target/release/bundle/macos
            artifact: Astrolabe-mac.tgz
          - os: windows-latest
            targets: '["nsis"]'
            bundle: app/src-tauri/target/release/bundle/nsis
            artifact: "*.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.9
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
      - run: pnpm --dir app install --frozen-lockfile
      - run: cargo build --release --locked -p astrolabe
      - name: Put the core where the bundler looks
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p app/src-tauri/binaries
          cp "target/release/astrolabe$(rustc --print cfg | grep -q windows && echo .exe)" "app/src-tauri/binaries/astrolabe-$triple$(rustc --print cfg | grep -q windows && echo .exe)"
      - name: Build unsigned
        shell: bash
        run: |
          pnpm --dir app tauri build --config '{"bundle":{"active":true,"targets":${{ matrix.targets }},"externalBin":["binaries/astrolabe"]}}'
      - name: Archive the Mac app, as an upload would lose its permissions
        if: runner.os == 'macOS'
        run: tar -czf "${{ matrix.bundle }}/Astrolabe-mac.tgz" -C "${{ matrix.bundle }}" Astrolabe.app
      - uses: actions/upload-artifact@v7
        with:
          name: astrolabe-smoke-${{ matrix.os }}
          path: |
            ${{ matrix.bundle }}/${{ matrix.artifact }}
            adapters/package.json
            adapters/pnpm-lock.yaml
