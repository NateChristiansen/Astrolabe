[package]
name = "astrolabe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = "=1.0.229"
serde_json = "1"
sha2 = "0.10"
protocol = { path = "../protocol" }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
getrandom = "=0.4.3"

# Not a test target: it runs as a real child process, and cargo test builds it.
[[example]]
name = "fake_agent"
path = "tests/common/fake_agent.rs"
