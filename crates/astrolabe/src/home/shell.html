<!doctype html><html lang="en" data-palette="{palette}"{theme_attr}><head><meta charset="utf-8">{refresh}<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="{scheme}">{csp}
<title>{title}</title>
<link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,{favicon}">
<style>{palettes}{style}</style></head><body>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="{home}#overview" data-home aria-label="Astrolabe home">{icon}<span>Astrolabe</span></a>
    <nav class="navigation" aria-label="Main navigation">{navigation}</nav>
    <div class="side-foot"><span class="workspace-label">Your workspace</span><span class="live" id="live" hidden>Live updates</span></div>
  </aside>
  <button class="scrim" id="scrim" type="button" aria-label="Close navigation" hidden></button>
  <main class="main" id="main" tabindex="-1">
    <header class="topbar">
      <button class="btn menu-btn" id="menu" type="button" aria-label="Collapse sidebar" aria-controls="side" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <div class="crumb" id="crumb">{crumb}</div>
      <div class="look-controls">
        <details class="palette-picker" id="palette-picker"><summary class="btn" aria-label="Color palette"><span class="palette-dot" aria-hidden="true"></span><span id="palette-name">Iris</span><span aria-hidden="true">⌄</span></summary><div class="palette-menu" role="group" aria-label="Color palette"><p>Color palette</p>{swatches}<div class="system-setting"><label><input type="checkbox" id="system-appearance"> Follow system appearance</label></div></div></details>
        <button class="btn appearance-toggle" id="appearance-toggle" type="button" aria-label="Switch appearance"><span id="appearance-icon" aria-hidden="true">☼</span><span class="appearance-label">Light</span></button>
      </div>
    </header>
    <div id="content">{back}{body}</div>
    <section class="notes-browser" id="notes-browser" hidden><h1>Your notes</h1><p>The context behind the work.</p><div class="search"><label for="q">Find a note</label><input id="q" type="search" placeholder="Search notes and efforts…"></div><nav class="tree" id="tree" aria-label="Notes">{tree}</nav><p id="no-notes" hidden>No matching notes. Try a shorter phrase.</p></section>
  </main>
</div>
<script>{script}</script>
</body></html>
