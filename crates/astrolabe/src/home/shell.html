<!doctype html><html lang="en" data-palette="{palette}"{theme_attr}><head><meta charset="utf-8">{refresh}<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="{scheme}">{csp}
<title>{title}</title>
<link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,{favicon}">
<style>{palettes}{style}</style></head><body>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="{home}#overview" data-home aria-label="Astrolabe home">{icon}<span>Astrolabe</span></a>
    <nav class="navigation" aria-label="Main navigation">{navigation}</nav>
    <div class="side-foot"><span class="workspace-label">Your workspace</span><span class="live" id="live" role="status" hidden>Live updates</span></div>
  </aside>
  <button class="scrim" id="scrim" type="button" aria-label="Close navigation" hidden></button>
  <main class="main" id="main" tabindex="-1">
    <header class="topbar">
      <button class="btn menu-btn" id="menu" type="button" aria-label="Collapse sidebar" aria-controls="side" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <div class="crumb" id="crumb">{crumb}</div>
      <div class="look-controls">
        <details class="palette-picker" id="palette-picker"><summary class="btn" aria-label="Color palette"><span class="palette-dot" aria-hidden="true"></span><span id="palette-name">Iris</span><svg class="chev-down" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="palette-menu" role="group" aria-label="Color palette"><p>Color palette</p>{swatches}<div class="system-setting"><label><input type="checkbox" id="system-appearance"> Follow system appearance</label></div></div></details>
        <button class="btn appearance-toggle" id="appearance-toggle" type="button" aria-label="Switch appearance"><span id="appearance-icon" aria-hidden="true">☼</span><span class="appearance-label">Light</span></button>
      </div>
    </header>
    <div id="content">{body}</div>
    <section class="notes-browser frame" id="notes-browser" hidden><div class="notes-main"><header class="page-head"><h1>Your notes</h1><p>The context behind the work.</p></header><div class="search"><label for="q">Find a note</label><div class="search-box"><svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search titles and note text…" maxlength="200" autocomplete="off" spellcheck="false" aria-describedby="search-status"><kbd class="search-key" id="q-key" title="Press / to search">/</kbd><button class="search-clear" id="q-clear" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="scopes" id="scopes" role="group" aria-label="Search in" hidden></div><p class="search-status" id="search-status" role="status" hidden></p></div><nav class="tree" id="tree" aria-label="Notes">{tree}</nav><p class="no-notes" id="no-notes" hidden>No matching notes. Try fewer words or another folder.</p></div><aside class="rail"><nav class="outline jump" id="jump" aria-label="Folders"><h4>Folders</h4></nav><button class="rail-btn" id="collapse-all" type="button">Collapse all folders</button></aside></section>
  </main>
</div>
<script>{script}</script>
</body></html>
